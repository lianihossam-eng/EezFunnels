name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/install-cargo-audit.sh
      - run: bash scripts/install-wasm-bindgen.sh
      - run: npm ci --no-audit --no-fund
      - run: cargo xtask ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pr010:migration
      - run: npm run test:pr010:browser
      - run: npm run test:pr019:fuzz
      - run: npm run test:pr019:browser
      - run: npm run test:pr019:load
      - run: cargo run -p eez-cli --locked -- --help
