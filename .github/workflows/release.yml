name: Release

on:
  pull_request:
    branches: [main]
  push:
    tags: [v0.1.0]

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: eez
            asset: eez-v0.1.0-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: eez
            asset: eez-v0.1.0-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: eez.exe
            asset: eez-v0.1.0-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p eez-cli --target ${{ matrix.target }}
      - run: cargo test --locked -p eez-cli --target ${{ matrix.target }}
      - name: Package release binary
        if: github.ref == 'refs/tags/v0.1.0'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - name: Upload release binary
        if: github.ref == 'refs/tags/v0.1.0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate and verify SHA256SUMS
        working-directory: dist
        run: |
          sha256sum eez-v0.1.0-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/eez-v0.1.0-* \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Eez Funnel v0.1.0" \
            --notes-file release-notes/v0.1.0.md
