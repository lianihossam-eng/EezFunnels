name = "eezfunnel"
main = "apps/api/build/worker/shim.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "bash scripts/install-wasm-bindgen.sh && cargo xtask dashboard-assets && cd apps/api && worker-build --release"

[assets]
directory = "./apps/dashboard/dist"
binding = "ASSETS"
run_worker_first = ["/*"]

[observability]
enabled = true

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "eezfunnel"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "eezfunnel-assets"

[[kv_namespaces]]
binding = "KV"
id = "00000000-0000-0000-0000-000000000004"

[vars]
ENVIRONMENT = "production"
ALLOWED_HOSTS = "eezfunnel.workers.dev"
V2_STAGE_ORPHAN_BYTE_BUDGET = "104857600"
V2_STAGE_ORPHAN_KEY_BUDGET = "1000"

[env.dev]
name = "eezfunnel-dev"

[env.dev.vars]
ENVIRONMENT = "development"
ALLOWED_HOSTS = "localhost:8787"
V2_STAGE_ORPHAN_BYTE_BUDGET = "104857600"
V2_STAGE_ORPHAN_KEY_BUDGET = "1000"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "eezfunnel-dev"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "eezfunnel-assets-dev"

[[env.dev.kv_namespaces]]
binding = "KV"
id = "00000000-0000-0000-0000-000000000002"

[env.dev.triggers]
crons = ["*/15 * * * *"]
