name = "eezfunnel"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "eezfunnel"
database_id = "REPLACE_ME"

[[r2_buckets]]
binding = "R2"
bucket_name = "eezfunnel-assets"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_ME"

[vars]
ENVIRONMENT = "production"
ALLOWED_HOSTS = "eezfunnel.workers.dev,localhost:8787"

[env.dev]
name = "eezfunnel-dev"

[env.dev.vars]
ENVIRONMENT = "development"
ALLOWED_HOSTS = "localhost:8787"
