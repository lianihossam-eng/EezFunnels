[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/render",
    "crates/storage",
    "crates/commands",
    "apps/api",
    "apps/dashboard",
    "apps/cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eezfunnel/eezfunnel"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
thiserror = "1"
worker = { version = "=0.8.3", features = ["http", "axum", "d1"] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3"
dioxus = "0.7"
rmcp = "1.4"
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
