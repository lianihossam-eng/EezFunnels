[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/render",
    "crates/storage",
    "crates/commands",
    "apps/api",
    "apps/dashboard",
    "apps/cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eezfunnel/eezfunnel"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
worker = { version = "0.8", features = ["http", "axum"] }
axum = "0.8"
axum-cloudflare-adapter = "0.14"
dioxus = "0.7"
rmcp = "1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
