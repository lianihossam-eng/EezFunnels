[package]
name = "eez-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.eez]
layer = 3

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus.workspace = true
dioxus-fullstack-core = { workspace = true, optional = true }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-web = { workspace = true, features = ["hydrate", "document"], optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
default = ["ssr"]
ssr = ["dioxus/ssr", "dep:dioxus-fullstack-core"]
browser = ["dioxus/web", "dep:dioxus-web", "dep:wasm-bindgen"]
